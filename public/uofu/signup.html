<!DOCTYPE html>
<html lang="en-US" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>U of U Student Logs - Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="/uofu/css/style.css" />
</head>
<body>
  <nav class="navbar navbar-dark px-4 mb-5 uofu-navbar">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <span class="fs-5 fw-bold">U of U Student Logs</span>
    </a>
    <span class="text-white-50 small">University of Utah</span>
  </nav>

  <div class="container" style="max-width:480px">
    <div class="card p-4">
      <h2 class="mb-1 text-center uofu-text fw-bold">Create Account</h2>
      <p class="text-center text-muted mb-4 small">Register as a U of U student</p>
      <div id="error-msg" class="alert alert-danger d-none py-2"></div>
      <div id="success-msg" class="alert alert-success d-none py-2"></div>
      <form id="signup-form">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
          <input type="text" id="username" class="form-control" placeholder="Choose a username" required autocomplete="username" />
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Display Name</label>
          <input type="text" id="displayName" class="form-control" placeholder="Your full name" />
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Student ID <span class="text-muted">(8 digits)</span></label>
          <input type="text" id="uvuId" class="form-control" placeholder="e.g. 20234567" maxlength="8" pattern="\d{8}" />
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
          <input type="password" id="password" class="form-control" placeholder="Create a password" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn uofu-btn w-100 py-2 fw-semibold">Create Student Account</button>
      </form>
      <hr class="my-3" />
      <p class="text-center mb-0 small">
        Already have an account? <a href="/uofu/login" class="uofu-text fw-semibold">Sign in</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script>
    document.getElementById('signup-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const errEl = document.getElementById('error-msg');
      const sucEl = document.getElementById('success-msg');
      errEl.classList.add('d-none'); sucEl.classList.add('d-none');
      const btn = e.submitter;
      btn.disabled = true; btn.textContent = 'Creating account...';
      try {
        const res = await fetch('/uofu/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username:    document.getElementById('username').value.trim(),
            password:    document.getElementById('password').value,
            displayName: document.getElementById('displayName').value.trim(),
            uvuId:       document.getElementById('uvuId').value.trim(),
            role:        'student',
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.message || 'Sign up failed';
          errEl.classList.remove('d-none');
          btn.disabled = false; btn.textContent = 'Create Student Account';
          return;
        }
        sucEl.textContent = 'Account created! Redirecting to login...';
        sucEl.classList.remove('d-none');
        setTimeout(() => window.location.href = '/uofu/login', 1500);
      } catch {
        errEl.textContent = 'Network error. Please try again.';
        errEl.classList.remove('d-none');
        btn.disabled = false; btn.textContent = 'Create Student Account';
      }
    });
  </script>
</body>
</html>
