<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Student Logs</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="https://www.uvu.edu/favicon.ico"/>

    <!-- styles -->
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  </head>

  <body>
    <header class="uvu-header">
      Student Logs
    </header>
    <form>
      <select
        aria-label="Select Course"
        id="course"
        name="course"
        data-cy="course_select"
      ></select
      ><br />

      <div id="id-entry" class="hidden">
        <label for="uvuId">UVU ID</label><br />
        <input
          type="text"
          id="uvuId"
          name="uvuId"
          data-cy="uvuId_input"
          placeholder="10234567"
          maxlength="8"
          pattern="\d{8}"
          inputmode="numeric"
        />
      </div>

      <div id="student-logs" class="hidden">
        <h3 id="uvuIdDisplay" data-cy="uvuIdDisplay">
          Student Logs for 10234567
        </h3>
        <ul id="logs-list" data-cy="logs"></ul>

        <div class="new-log">
          <label>New Log</label><br />
          <textarea
            id="new-log-text"
            style="height: 75px"
            aria-label="add log textarea"
            data-cy="log_textarea"
          ></textarea
          ><br />

          <button type="submit" id="add-log-btn" data-cy="add_log_btn" disabled>
            Add Log
          </button>
        <div>
      </div>
    </form>

    <script src="/js/script.js"></script>
  </body>
</html>
