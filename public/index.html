<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Student Logs</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="https://www.uvu.edu/favicon.ico"/>

    <!-- styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  </head>

  <body class="bg-light">
    <nav class="navbar navbar-dark bg-success px-4 mb-4">
      <a class="navbar-brand d-flex align-items-center gap-3" href="#">
        <img src="https://www.uvu.edu/_common/images/uvu-mono.svg" alt="UVU Logo" height="40">
        <span class="fs-4 fw-semibold">Student Logs</span>
      </a>
      <button type="button" id="theme-toggle" class="btn btn-outline-light" aria-label="Toggle dark mode">
        <span class="theme-icon">🌙</span>
      </button>
    </nav>

    <div class="container" style="max-width: 850px;">
      <form class="card shadow-sm p-4">
        <select
          aria-label="Select Course"
          id="course"
          name="course"
          data-cy="course_select"
          class="form-select"
        ></select
        ><br />

        <div id="id-entry" class="hidden">
          <label for="uvuId">UVU ID</label><br />
          <input
            type="text"
            id="uvuId"
            name="uvuId"
            data-cy="uvuId_input"
            placeholder="10234567"
            maxlength="8"
            pattern="\d{8}"
            inputmode="numeric"
            class="form-control"
          />
        </div>

        <div id="student-logs" class="">
          <h3 id="uvuIdDisplay" data-cy="uvuIdDisplay" class="border-bottom pb-2 text-success fw-bold mt-4">
            Student Logs for 10234567
          </h3>
          <ul id="logs-list" data-cy="logs" class="list-group mb-3"></ul>

          <div class="card card-body bg-white border-start border-success border-1 mt-3">
            <label class="form-label fw-semibold">New Log</label><br />
            <textarea
              id="new-log-text"
              style="height: 75px"
              aria-label="add log textarea"
              data-cy="log_textarea"
              class="form-control"
            ></textarea
            ><br />

            <button type="submit" id="add-log-btn" data-cy="add_log_btn" class="btn btn-success" disabled>
              Add Log
            </button>
          <div>
        </div>
      </form>
    </div>
    <script src="/js/script.js"></script>
    <!-- jquery -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script>
      if (typeof jQuery === 'undefined') {
        document.write('<script src="/js/jquery.min.js"><\/script>');
      }
    </script>
  </body>
</html>
