<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Student Logs</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="https://www.uvu.edu/favicon.ico"/>

    <!-- styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS: CDN first, fallback to local -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
      rel="stylesheet"
      crossorigin="anonymous"
      onerror="this.onerror=null; this.href='/css/bootstrap.min.css';"
    >
  </head>

  <body>
    <nav class="navbar navbar-dark bg-success px-4 mb-4">
      <a class="navbar-brand d-flex align-items-center gap-3" href="#">
        <img src="https://www.uvu.edu/_common/images/uvu-mono.svg" alt="UVU Logo" height="40">
        <span class="fs-4 fw-semibold">Student Logs</span>
      </a>
      <button type="button" id="theme-toggle" class="btn btn-outline-light" aria-label="Toggle dark mode">
        <span class="theme-icon">🌙</span>
      </button>
    </nav>

    <div class="container" style="max-width: 850px;">
      <form class="card shadow-sm p-4">

        <button id="show-update-course-btn" class="btn btn-link text-decoration-none mt-0 p-0 text-dark float-end d-none">Update Course</button>
        
        <select
          aria-label="Select Course"
          id="course"
          name="course"
          data-cy="course_select"
          class="form-select"
        ></select
        ><br />
        
        <div id="add-course" class="mt-3 d-none">
          <div class="mb-3">
            <label for="course-name" class="form-label">Course Display Name</label>
            <input type="text" id="course-name" name="course-name" class="form-control" placeholder="CS 1234">
          </div>
          <div class="mb-3">
            <label for="course-id" class="form-label">Course ID</label>
            <input type="text" id="course-id" name="course-id" class="form-control" placeholder="cs1234">
          </div>
          <button type="submit" id="add-course-btn" data-cy="add-course-btn" class="btn btn-success">Add Course</button>
        </div>

        <div id="update-course" class="mt-2 mb-3 p-3 card shadow-sm d-none">
          <div class="mb-3">
            <label for="course-name-update" class="form-label">Course Display Name</label>
            <input type="text" id="course-name-update" name="course-name" class="form-control">
          </div>
          <div class="mb-3">
            <label for="course-id-update" class="form-label">Course ID (associated logs will persist on old id)</label>
            <input type="text" id="course-id-update" name="course-id" class="form-control" placeholder="cs1234">
          </div>
          <input type="hidden" id="course-original-id" />
          <button type="submit" id="update-course-btn" data-cy="add-course-btn" class="btn btn-success">Save</button>
        </div>

        <div id="id-entry" class="d-none">
          <label for="uvuId">UVU ID</label><br />
          <input
            type="text"
            id="uvuId"
            name="uvuId"
            data-cy="uvuId_input"
            placeholder="10234567"
            maxlength="8"
            pattern="\d{8}"
            inputmode="numeric"
            class="form-control"
          />
        </div>

        <div id="student-logs" class="d-none">
          <h3 id="uvuIdDisplay" data-cy="uvuIdDisplay" class="border-bottom pb-2 text-success fw-bold mt-4">
            Student Logs for 10234567
          </h3>
          <ul id="logs-list" data-cy="logs" class="list-group mb-3"></ul>

          <div class="card card-body border-start border-success border-1 mt-3">
            <label class="form-label fw-semibold">New Log</label><br />
            <textarea
              id="new-log-text"
              style="height: 75px"
              aria-label="add log textarea"
              data-cy="log_textarea"
              class="form-control"
            ></textarea
            ><br />

            <button type="submit" id="add-log-btn" data-cy="add_log_btn" class="btn btn-success" disabled>
              Add Log
            </button>
          <div>
        </div>
      </form>
    </div>

    <!-- jQuery: CDN first, fallback to local -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
    <script>
      if (typeof jQuery === 'undefined') {
        document.write('<script src="/js/jquery.min.js"><\/script>');
      }
    </script>

    <!-- Bootstrap JS: CDN first, fallback to local -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
      if (typeof bootstrap === 'undefined') {
        document.write('<script src="/js/bootstrap.bundle.min.js"><\/script>');
      }
    </script>

    <script src="/js/script.js"></script>
  </body>
</html>
