<!DOCTYPE html>
<html lang="en-US" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UVU Student Logs - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="/uvu/css/style.css" />
</head>
<body>
  <nav class="navbar navbar-dark px-4 mb-5 uvu-navbar">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <span class="fs-5 fw-bold">UVU Student Logs</span>
    </a>
    <span class="text-white-50 small">Utah Valley University</span>
  </nav>

  <div class="container" style="max-width:420px">
    <div class="card p-4">
      <h2 class="mb-1 text-center uvu-text fw-bold">Welcome Back</h2>
      <p class="text-center text-muted mb-4 small">Sign in to your UVU account</p>
      <div id="error-msg" class="alert alert-danger d-none py-2"></div>
      <form id="login-form">
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter username" required autocomplete="username" />
        </div>
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn uvu-btn w-100 py-2 fw-semibold">Sign In</button>
      </form>
      <hr class="my-3" />
      <p class="text-center mb-0 small">
        New student? <a href="/uvu/signup" class="uvu-text fw-semibold">Create account</a>
      </p>
      <p class="text-center mt-2 mb-0 small text-muted">
        Wrong university? <a href="/" class="text-muted">Go back</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const errEl = document.getElementById('error-msg');
      errEl.classList.add('d-none');
      const btn = e.submitter;
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      try {
        const res = await fetch('/uvu/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.message || 'Login failed';
          errEl.classList.remove('d-none');
          btn.disabled = false; btn.textContent = 'Sign In';
          return;
        }
        window.location.href = '/uvu/dashboard';
      } catch {
        errEl.textContent = 'Network error. Please try again.';
        errEl.classList.remove('d-none');
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
